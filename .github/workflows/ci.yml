name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install packages
        # ServerPackages (ProfileStore) is gitignored; Rojo and the type
        # checker both need it.
        run: wally install

      - name: Check formatting
        run: stylua --check src tests

      - name: Lint
        run: selene src tests

      - name: Type check
        run: bash scripts/typecheck.sh

      - name: Build place
        run: rojo build default.project.json -o build.rbxl
